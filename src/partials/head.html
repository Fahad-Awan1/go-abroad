<script>
  /* Decide the intro state before the first paint so nothing flashes:
     ga-first = first visit (show loader), ga-fly = arriving from an internal link (start covered by the fly-through sky). */
  (function (d) {
    var c = d.documentElement.classList, s;
    c.add('js');
    try { s = window.sessionStorage; } catch (e) {}
    if (!s || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (s.getItem('ga-fly')) c.add('ga-fly');
    else if (s.getItem('ga-visited') !== '1') c.add('ga-first');
  })(document);
</script>
